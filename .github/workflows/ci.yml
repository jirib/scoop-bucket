name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly on Sunday to detect upstream breaking changes
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema requests

      - name: Validate Scoop Manifest JSON
        run: |
          python -c '
          import json
          import glob
          import urllib.request
          from jsonschema import validate, ValidationError

          schema_url = "https://raw.githubusercontent.com/ScoopInstaller/Scoop/master/schema.json"
          try:
              with urllib.request.urlopen(schema_url) as response:
                  schema = json.loads(response.read().decode())
          except Exception as e:
              print(f"Failed to fetch Scoop schema: {e}")
              exit(1)

          manifests = glob.glob("bucket/*.json")
          if not manifests:
              print("No manifests found in bucket/")
              exit(1)

          failed = False
          for manifest_path in manifests:
              print(f"Validating {manifest_path}...")
              try:
                  with open(manifest_path, "r", encoding="utf-8") as f:
                      manifest = json.load(f)
                  validate(instance=manifest, schema=schema)
                  print(f"  {manifest_path} is valid.")
              except json.JSONDecodeError as e:
                  print(f"  Error parsing JSON: {e}")
                  failed = True
              except ValidationError as e:
                  print(f"  Schema validation error in {manifest_path}: {e.message}")
                  failed = True
              except Exception as e:
                  print(f"  Unexpected error in {manifest_path}: {e}")
                  failed = True

          if failed:
              exit(1)
          '

  test:
    name: Integration Test (Windows)
    runs-on: windows-latest
    needs: lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Scoop
        shell: powershell
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope Process -Force
          $env:SCOOP = "$env:USERPROFILE\scoop"
          [Environment]::SetEnvironmentVariable('SCOOP', $env:SCOOP, 'User')
          # Install Scoop using standard installer
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression

      - name: Verify Scoop Installation
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop --version

      - name: Add Local Bucket and Install ConTeXt
        shell: powershell
        run: |
          git config --global --add safe.directory '*'
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          # Add current repository directory as local bucket
          $bucket_path = ([System.Uri] "$env:GITHUB_WORKSPACE").AbsoluteUri
          scoop bucket add local-bucket $bucket_path
          # Install context from the local bucket
          scoop install local-bucket/context

      - name: Diagnose ConTeXt Tree
        if: always()
        shell: powershell
        run: |
          $appDir = "$env:USERPROFILE\scoop\apps\context\current"

          Write-Host "=== app dir item info (checking for reparse point/symlink from 'persist') ==="
          Get-Item $appDir | Format-List *
          $texPath = Join-Path $appDir 'tex'
          Get-Item $texPath | Format-List *

          Write-Host "=== top-level tex\ listing ==="
          Get-ChildItem $texPath | Format-Table Name, Mode, LastWriteTime

          Write-Host "=== tex\texmf-context top-level listing ==="
          $ctxTree = Join-Path $texPath 'texmf-context'
          if (Test-Path $ctxTree) {
              Get-ChildItem $ctxTree | Format-Table Name, Mode
              $count = (Get-ChildItem $ctxTree -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
              Write-Host "tex\texmf-context contains $count files (recursive)"
          } else {
              Write-Host "tex\texmf-context does NOT exist"
          }

          Write-Host "=== tex\texmf-context\web2c listing ==="
          $web2c = Join-Path $ctxTree 'web2c'
          if (Test-Path $web2c) {
              Get-ChildItem $web2c | Format-Table Name, Length
          } else {
              Write-Host "tex\texmf-context\web2c does NOT exist"
          }

          Write-Host "=== tex\texmf top-level listing ==="
          $texmfTree = Join-Path $texPath 'texmf'
          if (Test-Path $texmfTree) {
              $count = (Get-ChildItem $texmfTree -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
              Write-Host "tex\texmf contains $count files (recursive)"
          } else {
              Write-Host "tex\texmf does NOT exist"
          }

          Write-Host "=== searching entire tex tree for texmfcnf.lua / contextcnf.lua ==="
          Get-ChildItem $texPath -Recurse -Filter 'texmfcnf.lua' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "found: $($_.FullName)" }
          Get-ChildItem $texPath -Recurse -Filter 'contextcnf.lua' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "found: $($_.FullName)" }

      - name: Verify ConTeXt Installation
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          
          Write-Host "Checking mtxrun version..."
          $mtxrunOutput = mtxrun --version 2>&1 | Out-String
          Write-Host $mtxrunOutput
          if ($LastExitCode -ne 0 -or $mtxrunOutput -match 'unknown script') {
              throw "mtxrun --version failed with exit code $LastExitCode"
          }

          Write-Host "Checking context version..."
          $contextOutput = context --version 2>&1 | Out-String
          Write-Host $contextOutput
          # mtxrun/context can exit 0 even when the script/tree lookup fails, so
          # don't rely on the exit code alone - the output itself must not report
          # a resolver failure.
          if ($LastExitCode -ne 0 -or $contextOutput -match 'unknown script' -or $contextOutput -match 'resolver databases are not present') {
              throw "context --version failed with exit code $LastExitCode. Output:`n$contextOutput"
          }

      - name: Verify Scoop Checkver
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" -App "$env:GITHUB_WORKSPACE\bucket\context.json"
